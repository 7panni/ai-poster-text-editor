<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI海报文字快改</title>
  <meta name="theme-color" content="#101a16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --ink: #14201b;
      --ink-2: #1c2b24;
      --ink-3: #293a31;
      --paper: #e9dfc3;
      --paper-2: #c8b98d;
      --gold: #c8a968;
      --gold-hi: #efd18a;
      --fog: #aab5ad;
      --line: rgba(233, 223, 195, .14);
      --danger: #d78770;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: #edf0ec; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, .file-button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .file-button:focus-within {
      outline: 2px solid var(--gold-hi); outline-offset: 2px;
    }

    .app { height: 100vh; display: grid; grid-template-rows: 56px minmax(0, 1fr); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 0 18px; border-bottom: 1px solid var(--line); background: #101a16;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
    .brand b { font-size: 16px; letter-spacing: .06em; color: var(--gold-hi); }
    .brand span { color: var(--fog); font-size: 11px; }
    .top-actions { position: relative; display: flex; align-items: center; gap: 6px; }
    button, .file-button {
      border: 1px solid var(--line); background: var(--ink-2); border-radius: 7px; padding: 8px 11px;
      cursor: pointer; transition: border-color .15s, background .15s, transform .15s;
    }
    button:hover, .file-button:hover { border-color: rgba(239,209,138,.55); background: var(--ink-3); }
    button:active, .file-button:active { transform: translateY(1px); }
    button.primary { background: var(--gold); color: #152019; border-color: var(--gold); font-weight: 700; }
    button.primary:hover { background: var(--gold-hi); }
    button.icon { min-width: 34px; padding: 8px; }
    button:disabled { opacity: .38; cursor: default; transform: none; }
    .file-button { display: inline-flex; align-items: center; }
    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .toolbar-button {
      height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 11px; border-color: rgba(233,223,195,.16); border-radius: 8px;
      background: #17241e; color: #dce3dd; font-size: 13px; font-weight: 600; white-space: nowrap;
      box-shadow: inset 0 1px rgba(255,255,255,.025), 0 1px 2px rgba(0,0,0,.16);
    }
    .toolbar-button svg { width: 16px; height: 16px; flex: none; color: #b8c3bb; }
    .toolbar-button:hover { color: #fff7df; background: #213129; border-color: rgba(239,209,138,.42); }
    .toolbar-button:hover svg { color: var(--gold-hi); }
    .toolbar-button.primary { color: #142019; background: #d5b66f; border-color: #d5b66f; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .toolbar-button.primary svg { color: #142019; }
    .toolbar-button.compact { min-width: 38px; padding-inline: 9px; }
    .toolbar-button[aria-expanded="true"] { color: var(--gold-hi); border-color: rgba(239,209,138,.55); background: #26372e; }
    .action-group { position: relative; display: inline-flex; }
    .action-group > .toolbar-button:first-child { border-radius: 8px 0 0 8px; }
    .action-group > .menu-trigger { width: 27px; min-width: 27px; padding: 0; border-left-color: rgba(233,223,195,.08); border-radius: 0 8px 8px 0; }
    .action-menu { position: absolute; z-index: 31; top: 44px; right: 0; width: 210px; padding: 6px; border: 1px solid rgba(239,209,138,.24); border-radius: 9px; background: #14201b; box-shadow: 0 18px 48px rgba(0,0,0,.46); }
    .action-menu[hidden] { display: none; }
    .action-menu button { width: 100%; padding: 9px 10px; border: 0; background: transparent; text-align: left; font-size: 12px; }
    .action-menu button:hover { background: rgba(255,255,255,.055); }
    .settings-menu {
      position: absolute; z-index: 30; top: 42px; right: 44px; width: 300px; padding: 12px;
      border: 1px solid rgba(239,209,138,.24); border-radius: 10px; background: #14201b;
      box-shadow: 0 18px 48px rgba(0,0,0,.46); color: #edf0ec;
    }
    .settings-menu[hidden] { display: none; }
    .settings-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 9px; font-size: 12px; color: var(--gold-hi); }
    .save-choice { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 9px 8px; border-radius: 7px; cursor: pointer; }
    .save-choice:hover { background: rgba(255,255,255,.035); }
    .save-choice input { margin: 2px 0 0; accent-color: var(--gold); }
    .save-choice b { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 650; }
    .save-choice small { display: block; color: #8f9d94; font-size: 10px; line-height: 1.45; }
    .settings-folder { width: 100%; margin-top: 8px; padding: 8px 10px; color: var(--paper); font-size: 11px; }

    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(320px, 1fr) 380px; }
    .panel { min-height: 0; background: #15211c; }
    .properties-panel { border-left: 1px solid var(--line); display: grid; grid-template-rows: 48px minmax(0,1fr) auto; overflow: hidden; }
    .panel-head { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--fog); font-weight: 650; }
    .side-tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: #0c1511; }
    .side-tabs button { border: 0; padding: 5px 9px; background: transparent; color: var(--fog); font-size: 12px; }
    .side-tabs button.active { background: var(--ink-3); color: var(--gold-hi); box-shadow: inset 0 0 0 1px rgba(200,169,104,.28); }

    .stage-wrap { min-width: 0; min-height: 0; background: #0d1512; }
    .visual-mode { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0,1fr) 42px; }
    .stage {
      min-width: 0; min-height: 0; overflow: hidden; position: relative; display: grid; place-items: center;
      background-color: #111a16;
      background-image: radial-gradient(circle at 1px 1px, rgba(233,223,195,.09) 1px, transparent 0);
      background-size: 18px 18px;
    }
    .stage::after {
      content: attr(data-drop-label); position: absolute; inset: 14px; display: grid; place-items: center;
      border: 2px dashed rgba(239,209,138,.7); border-radius: 12px; background: rgba(11,20,16,.78);
      color: var(--gold-hi); font-size: 15px; font-weight: 700; letter-spacing: .04em;
      opacity: 0; pointer-events: none; transition: opacity .15s;
    }
    .stage.drag-over::after { opacity: 1; }
    .canvas-shell { position: relative; box-shadow: 0 20px 65px rgba(0,0,0,.45); touch-action: none; user-select: none; }
    canvas { width: 100%; height: 100%; display: block; background: #ddcfaa; }
    .stage-tools { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; border-top: 1px solid var(--line); background: #101a16; color: var(--fog); font-size: 12px; }
    .zoom-tools { grid-column: 2; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .credits { grid-column: 1; grid-row: 1; min-width: 0; padding-left: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; color: #829188; }
    .credits a { color: var(--paper-2); text-decoration: none; }
    .credits a:hover { color: var(--gold-hi); text-decoration: underline; }
    .stage-tools input[type=range] { width: 130px; accent-color: var(--gold); }
    #zoomValue { min-width: 38px; color: #edf0ec; }
    .side-pane { min-height: 0; overflow: auto; }
    .side-pane[hidden] { display: none; }
    .source-mode { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0,1fr) 88px; background: #0d1512; }
    .source-editor { min-height: 0; overflow: hidden; }
    .source-actions { display: grid; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: #101a16; }
    .source-status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fog); font-size: 12px; }
    .source-status.error { color: #f0b09e; }
    .source-buttons { display: flex; gap: 8px; flex: none; }

    .property-body { padding: 10px 14px 8px; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 14px 0; }
    .quick-actions button, .quick-actions .file-button { min-height: 36px; padding-block: 6px; width: 100%; justify-content: center; text-align: center; }
    .empty-state { color: var(--fog); font-size: 13px; line-height: 1.7; padding: 18px 8px; }
    .group { border: 0; padding: 0; margin: 0 0 10px; }
    .group legend { width: 100%; padding: 0 0 4px; margin-bottom: 6px; color: var(--gold); font-size: 11px; letter-spacing: .13em; border-bottom: 1px solid var(--line); }
    label.field { display: grid; gap: 5px; margin-bottom: 7px; color: #c4cec7; font-size: 13px; }
    .field input, .field select, .field textarea {
      width: 100%; color: #f5f6f3; border: 1px solid var(--line); background: #101a16; border-radius: 6px; padding: 7px 9px; font-size: 15px;
    }
    .field textarea { min-height: 58px; max-height: 82px; resize: vertical; line-height: 1.45; font-size: 16px; }
    .value-stepper { display: grid; grid-template-columns: 34px minmax(48px,1fr) 34px; gap: 5px; }
    .value-stepper button { min-height: 34px; padding: 0; font-size: 19px; line-height: 1; color: var(--gold-hi); border-color: rgba(200,169,104,.34); }
    .value-stepper input { min-width: 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--gold-hi); appearance: textfield; padding-inline: 3px; }
    .value-stepper input::-webkit-inner-spin-button, .value-stepper input::-webkit-outer-spin-button { appearance: none; margin: 0; }
    .font-status { margin: -3px 0 7px; color: #87968d; font-size: 11px; }
    .font-status.available { color: #9fc4a9; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .color-row { display: grid; grid-template-columns: 40px 1fr; gap: 8px; }
    .color-row input[type=color] { padding: 3px; height: 34px; }
    .align-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
    .align-row button.active { border-color: var(--gold); color: var(--gold-hi); background: rgba(200,169,104,.12); }
    .danger { color: #f0b09e; border-color: rgba(215,135,112,.35); width: 100%; }
    .hint { color: #829188; font-size: 11px; line-height: 1.45; margin: 5px 0 0; }
    .panel-footer { padding: 7px 14px; border-top: 1px solid var(--line); background: #101a16; }
    .panel-footer .danger { min-height: 34px; padding-block: 6px; font-size: 12px; }
    .danger-action { color: #f0b09e; border-color: rgba(215,135,112,.4); margin-top: 8px; width: 100%; }
    .danger-action:hover { border-color: rgba(215,135,112,.75); }
    .toast { position: fixed; left: 50%; bottom: 58px; z-index: 20; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; padding: 9px 13px; border-radius: 7px; background: #e5d7ad; color: #18231d; box-shadow: 0 8px 24px rgba(0,0,0,.32); transition: .2s; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .toast.show { opacity: 1; transform: translate(-50%,0); pointer-events: auto; }
    .toast-undo { border: 1px solid rgba(24,35,29,.45); background: transparent; color: #18231d; border-radius: 5px; padding: 2px 9px; font-weight: 700; font-size: 12px; cursor: pointer; flex: none; }
    .toast-undo:hover { background: rgba(24,35,29,.12); }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: min(62vh, 620px) auto; }
      .properties-panel { border-left: 0; border-top: 1px solid var(--line); min-height: 520px; }
      .topbar { height: auto; min-height: 56px; padding: 9px 12px; align-items: flex-start; }
      .top-actions { flex-wrap: wrap; justify-content: flex-end; }
      .toolbar-button { padding-inline: 8px; }
      .settings-menu { position: fixed; top: 62px; right: 10px; width: min(300px, calc(100vw - 20px)); }
      .brand span { display: none; }
      .credits { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><b data-i18n="appName">AI海报文字快改</b><span data-i18n="offline">本地离线</span></div>
      <div class="top-actions">
        <label id="backgroundButton" class="file-button toolbar-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h11a5 5 0 0 1 0 10H7"/><path d="m8 13-4 4 4 4"/></svg><span data-i18n="changeBackground">替换背景</span><input id="backgroundInput" type="file" accept="image/*"></label>
        <button id="layoutButton" class="toolbar-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h7M9 17h5"/></svg><span data-i18n="importLayout">导入排版</span></button><input id="layoutInput" type="file" accept="application/json,.json,.txt,.js,text/plain" hidden>
        <div class="action-group"><button id="saveLayout" class="toolbar-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3h12l2 2v16H5zM8 3v6h8V3M8 21v-7h8v7"/></svg><span data-i18n="saveLayout">保存排版</span></button><button id="saveMenuButton" class="toolbar-button menu-trigger" aria-expanded="false" aria-controls="saveMenu">▾</button><div id="saveMenu" class="action-menu" hidden><button data-save-action="saveAs" data-i18n="saveLayoutAs">排版另存为…</button><button data-save-action="last" data-i18n="saveLastFolder">保存到上次文件夹</button><button data-save-action="choose" data-i18n="chooseOutputFolder">选择输出文件夹…</button></div></div>
        <div class="action-group"><button id="exportPng" class="toolbar-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg><span data-i18n="exportPng">导出 PNG</span></button><button id="exportMenuButton" class="toolbar-button menu-trigger" aria-expanded="false" aria-controls="exportMenu">▾</button><div id="exportMenu" class="action-menu" hidden><button data-export-action="download" data-i18n="downloadPng">下载 PNG</button><button data-export-action="last" data-i18n="exportLastFolder">导出到上次文件夹</button><button data-export-action="choose" data-i18n="chooseOutputFolder">选择输出文件夹…</button></div></div>
        <button id="exportBundle" class="toolbar-button primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h8l4 4v14H7zM15 3v5h4M4 7v12"/></svg><span data-i18n="exportBundle">全部导出</span></button>
        <button id="settingsButton" class="toolbar-button" aria-expanded="false" aria-controls="settingsMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.38.37.72.66 1 .3.28.68.42 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg><span data-i18n="settings">设置</span></button>
        <button id="langToggle" class="toolbar-button compact" title="Switch to English">EN</button>
        <div id="settingsMenu" class="settings-menu" hidden>
          <div class="settings-title"><span data-i18n="localData">本机数据</span></div>
          <button id="clearSession" class="danger-action" data-i18n="clearSession">清除上次会话</button>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <section class="stage-wrap">
        <div id="visualMode" class="visual-mode">
          <div id="stage" class="stage" data-drop-label="拖入图片以替换背景">
            <div id="canvasShell" class="canvas-shell"><canvas id="coverCanvas"></canvas></div>
          </div>
          <div class="stage-tools">
            <div class="credits"><span data-i18n="developer">开发者：尚宸鸣</span> ｜ <span data-i18n="codexCredit">使用 Codex &amp; 牛来 协助开发</span> ｜ <a href="https://github.com/7panni/ai-poster-text-editor" target="_blank" rel="noreferrer" data-i18n="project">项目地址</a> ｜ <a href="https://7panni.com" target="_blank" rel="noreferrer" data-i18n="blog">作者博客</a></div>
            <div class="zoom-tools"><button id="undo" class="icon" title="撤销 (⌘Z)">↶</button><button id="redo" class="icon" title="重做 (⇧⌘Z)">↷</button><span data-i18n="preview">预览</span><input id="zoom" type="range" min="15" max="120" value="55"><span id="zoomValue">55%</span></div>
          </div>
        </div>
      </section>

      <aside class="panel properties-panel">
        <div class="panel-head"><div class="side-tabs"><button id="propertiesTab" class="active" data-i18n="textSettings">文字设置</button><button id="sourceTab">layout.json</button></div><span id="selectionHint">点击文字选择</span></div>
        <div id="propertyPane" class="side-pane"><div class="quick-actions"><button id="addText">＋ <span data-i18n="addText">添加文字</span></button><label class="file-button">＋ <span data-i18n="loadFont">加载本地字体</span><input id="fontInput" type="file" accept=".ttf,.otf,.woff,.woff2,font/*"></label></div><div id="propertyBody" class="property-body"></div></div>
        <div id="sourcePane" class="source-mode side-pane" hidden>
          <div id="sourceEditor" class="source-editor"></div>
          <div class="source-actions">
            <span id="sourceStatus" class="source-status" data-i18n="pasteJson">可直接粘贴 AI 给你的 JSON</span>
            <div class="source-buttons"><button id="formatSource" data-i18n="format">格式化</button><button id="applySource" class="primary" data-i18n="applyCanvas">应用到画布</button></div>
          </div>
        </div>
        <div class="panel-footer"><button id="clearAllTexts" class="danger" data-i18n="clearAll">清空全部文字</button></div>
      </aside>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/source-editor.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const canvas = $('#coverCanvas');
      const ctx = canvas.getContext('2d');
      const shell = $('#canvasShell');
      const stage = $('#stage');
      const propertyBody = $('#propertyBody');
      const FONT_FALLBACK = '"Noto Serif SC", "Songti SC", STSong, serif';
      const blankState = () => ({ canvas: { width: 1600, height: 900 }, texts: [] });
      let state = blankState();
      let selectedId = null;
      let backgroundImage = null;
      let backgroundData = null;
      let bgVersion = 0;
      const bgAssets = new Map();
      let zoom = .55;
      let dragging = null;
      let history = [], future = [], changeTimer = null, toastTimer = null;
      let sourceEditor = null, sourceDirty = false;
      let lastDirectoryHandle = null, layoutFileHandle = null, backgroundBaseName = 'cover';
      const loadedFonts = new Set();

      propertyBody.addEventListener('change', e=>{ if(e.target.dataset.key){renderProperties();pushHistory();fitCanvas();} });
      propertyBody.addEventListener('click', e=>{ const step=e.target.closest('[data-step-key]');if(step&&selected()){const key=step.dataset.stepKey,limits={size:[6,500],letterSpacing:[-20,100],lineHeight:[.7,3],x:[-99999,99999],y:[-99999,99999]},[min,max]=limits[key],delta=Number(step.dataset.step)*(e.shiftKey?Number(step.dataset.shift):1),digits=key==='lineHeight'?2:0;selected()[key]=Math.max(min,Math.min(max,Number((selected()[key]+delta).toFixed(digits))));pushHistory();refresh();return;}const align=e.target.closest('[data-align]');if(align){selected().align=align.dataset.align;pushHistory();refresh();} if(e.target.id==='deleteText'){state.texts=state.texts.filter(t=>t.id!==selectedId);selectedId=null;pushHistory();refresh();} });

      $('#addText').addEventListener('click',()=>{ const id='text_'+Date.now();state.texts.push({id,content:tr('newText'),x:state.canvas.width/2,y:state.canvas.height/2,font:'Noto Serif SC',size:90,color:'#344022',weight:'700',letterSpacing:4,lineHeight:1.2,align:'center',visible:true});selectedId=id;setSideTab('properties');pushHistory();refresh(); });
      $('#langToggle').addEventListener('click',()=>{currentLang=currentLang==='zh'?'en':'zh';applyLanguage();});
      $('#settingsButton').addEventListener('click',()=>setSettingsOpen($('#settingsMenu').hidden));
      function setActionMenu(id,open){['saveMenu','exportMenu'].forEach(menuId=>{const menu=$(`#${menuId}`),button=$(`#${menuId}Button`);const show=menuId===id&&open;menu.hidden=!show;button.setAttribute('aria-expanded',String(show));});}
      $('#saveMenuButton').addEventListener('click',()=>setActionMenu('saveMenu',$('#saveMenu').hidden));
      $('#exportMenuButton').addEventListener('click',()=>setActionMenu('exportMenu',$('#exportMenu').hidden));
      document.addEventListener('pointerdown',e=>{if(!$('#settingsMenu').hidden&&!e.target.closest('#settingsMenu')&&!e.target.closest('#settingsButton'))setSettingsOpen(false);if(!e.target.closest('.action-group'))setActionMenu('',false);});
      $('#propertiesTab').addEventListener('click',()=>setSideTab('properties')); $('#sourceTab').addEventListener('click',()=>setSideTab('source'));
      $('#applySource').addEventListener('click',applySource);
      $('#formatSource').addEventListener('click',()=>{const data=validateSource(sourceEditor.getValue());if(!data)return;sourceEditor.setValue(JSON.stringify({canvas:data.canvas,texts:data.texts.map(({id,content,x,y,font,size,color,weight,letterSpacing,lineHeight,align,visible})=>({id,content,x,y,font,size,color,weight,letter_spacing:letterSpacing,line_height:lineHeight,align,visible}))},null,2));sourceDirty=true;validateSource(sourceEditor.getValue());toast(tr('formatted'));});
      $('#undo').addEventListener('click',undo); $('#redo').addEventListener('click',redo);
      $('#clearAllTexts').addEventListener('click',()=>{if(!state.texts.length)return;state.texts=[];selectedId=null;pushHistory();refresh();toast(tr('cleared'),true);});
      $('#clearSession').addEventListener('click',async()=>{sessionPersistenceEnabled=false;clearTimeout(persistTimer);await persistQueue;await dbDelete('session','current');await dbDelete('session','layout');await dbDelete('session','background');state=blankState();backgroundData=null;backgroundBaseName='cover';bgVersion=0;bgAssets.clear();selectedId=null;history=[];future=[];await loadBackground(null);pushHistory(false);refresh();setSettingsOpen(false);toast(tr('sessionCleared'));});
      $('#zoom').addEventListener('input',e=>{zoom=Number(e.target.value)/100;$('#zoomValue').textContent=e.target.value+'%';fitCanvas();});

      async function replaceBackground(file){if(!file?.type?.startsWith('image/'))return;backgroundBaseName=file.name.replace(/\.[^.]+$/,'')||'cover';const data=await readFile(file,'data');const img=new Image();img.onload=async()=>{bgVersion+=1;bgAssets.set(bgVersion,data);backgroundData=data;state.canvas={width:img.naturalWidth,height:img.naturalHeight};await loadBackground(data);pushHistory();refresh();toast(`${tr('backgroundChanged')} ${img.naturalWidth} × ${img.naturalHeight}`,true);};img.src=data;}
      $('#backgroundInput').addEventListener('change', async e=>{await replaceBackground(e.target.files[0]);e.target.value='';});
      stage.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();stage.classList.add('drag-over');}});
      stage.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
      stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))stage.classList.remove('drag-over');});
      stage.addEventListener('drop',async e=>{e.preventDefault();stage.classList.remove('drag-over');const file=[...e.dataTransfer.files].find(item=>item.type.startsWith('image/'));if(file)await replaceBackground(file);});
      async function importLayoutFile(file,handle=null){if(!file)return;try{const data=parseLayout(await readFile(file,'text'));layoutFileHandle=handle;applyParsed(data,tr('layoutImported'));}catch(error){toast(`${tr('cannotRead')}：${error.message}`);}}
      $('#layoutButton').addEventListener('click',async()=>{if(!window.showOpenFilePicker){$('#layoutInput').click();return;}try{const [handle]=await window.showOpenFilePicker({multiple:false,types:[{description:tr('jsonLayout'),accept:{'application/json':['.json'],'text/plain':['.txt','.js']}}]});await importLayoutFile(await handle.getFile(),handle);}catch(error){if(error.name!=='AbortError')toast(`${tr('cannotRead')}：${error.message}`);}});
      $('#layoutInput').addEventListener('change', async e=>{await importLayoutFile(e.target.files[0]);e.target.value='';});
      $('#fontInput').addEventListener('change', async e=>{const file=e.target.files[0];if(!file)return;try{const family=file.name.replace(/\.[^.]+$/,'').replace(/[^\w\u4e00-\u9fff-]/g,' ');const face=new FontFace(family,await file.arrayBuffer());await face.load();document.fonts.add(face);loadedFonts.add(family);if(selected()){selected().font=family;pushHistory();refresh();}toast(`${tr('fontLoaded')}：${family}`);}catch{toast(tr('fontFailed'));}e.target.value='';});
      const outputNames=()=>({layout:backgroundBaseName==='cover'?'layout.json':`${backgroundBaseName}-layout.json`,png:backgroundBaseName==='cover'?'cover.png':`${backgroundBaseName}-cover.png`});
      const layoutBlob=()=>new Blob([layoutText()],{type:'application/json'});
      async function pngBlob(){render(false);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));render(true);return blob;}
      async function saveLayoutAction(mode='quick'){const {layout:name}=outputNames(),blob=layoutBlob();let ok=false;if(mode==='quick'&&layoutFileHandle)ok=await saveBlobToFile(blob,layoutFileHandle);else if(mode==='quick'||mode==='saveAs'){const handle=await saveAsBlob(blob,name,'application/json');if(handle){layoutFileHandle=handle;ok=true;}}else ok=await saveBlobToDirectory(blob,name,mode==='choose'?await chooseOutputDirectory():await writableLastDirectory());if(ok)toast(`${tr('saved')} ${layoutFileHandle?.name||name}`);}
      async function exportPngAction(mode='picker'){const {png:name}=outputNames(),blob=await pngBlob(),ok=mode==='download'?(download(blob,name),true):mode==='picker'?await saveAsBlob(blob,name,'image/png'):await saveBlobToDirectory(blob,name,mode==='choose'?await chooseOutputDirectory():await writableLastDirectory());if(ok)toast(`${tr('exported')} ${name} · ${state.canvas.width} × ${state.canvas.height}`);}
      async function exportBundle(){const names=outputNames(),layout=layoutBlob(),png=await pngBlob();if(!window.showDirectoryPicker){download(png,names.png);download(layout,names.layout);toast(tr('bundleExported'));return;}const directory=await writableLastDirectory();if(!directory)return;const pngOk=await saveBlobToDirectory(png,names.png,directory),layoutOk=await saveBlobToDirectory(layout,names.layout,directory);if(pngOk&&layoutOk)toast(`${tr('bundleExported')} · ${directory.name}`);}
      $('#saveLayout').addEventListener('click',()=>saveLayoutAction());
      $('#exportPng').addEventListener('click',()=>exportPngAction());
      $('#exportBundle').addEventListener('click',exportBundle);
      $('#saveMenu').addEventListener('click',e=>{const action=e.target.dataset.saveAction;if(action){setActionMenu('',false);saveLayoutAction(action);}});
      $('#exportMenu').addEventListener('click',e=>{const action=e.target.dataset.exportAction;if(action){setActionMenu('',false);exportPngAction(action);}});

      function readFile(file,type){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;type==='data'?r.readAsDataURL(file):r.readAsText(file);});}
      function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
      async function saveAsBlob(blob,name,type){if(!window.showSaveFilePicker){download(blob,name);return {name};}try{const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:type==='image/png'?tr('pngImage'):tr('jsonLayout'),accept:{[type]:[type==='image/png'?'.png':'.json']}}]});if(!await saveBlobToFile(blob,handle))return false;return handle;}catch(error){if(error.name!=='AbortError')toast(`${tr('saveFailed')}：${error.message}`);return false;}}
      async function saveBlobToFile(blob,handle){try{const writable=await handle.createWritable();await writable.write(blob);await writable.close();return true;}catch(error){if(error.name!=='AbortError')toast(`${tr('saveFailed')}：${error.message}`);return false;}}
      async function saveBlobToDirectory(blob,name,directory){if(!directory)return false;try{const handle=await directory.getFileHandle(name,{create:true});const writable=await handle.createWritable();await writable.write(blob);await writable.close();return true;}catch(error){if(error.name!=='AbortError')toast(`${tr('saveFailed')}：${error.message}`);return false;}}
      function point(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*state.canvas.width/rect.width,y:(e.clientY-rect.top)*state.canvas.height/rect.height};}
      shell.addEventListener('pointerdown',e=>{const p=point(e);const hit=[...state.texts].reverse().find(t=>t.visible!==false&&(()=>{const b=bounds(t);return p.x>=b.x-20&&p.x<=b.x+b.w+20&&p.y>=b.y-20&&p.y<=b.y+b.h+20;})());if(hit){selectedId=hit.id;setSideTab('properties');dragging={pointer:e.pointerId,dx:p.x-hit.x,dy:p.y-hit.y,start:snapshot()};shell.setPointerCapture(e.pointerId);refresh();}else{selectedId=null;dragging=null;refresh();}});
      shell.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const p=point(e),t=selected();t.x=p.x-dragging.dx;t.y=p.y-dragging.dy;render();});
      shell.addEventListener('pointerup',e=>{if(dragging?.pointer===e.pointerId){dragging=null;pushHistory();renderProperties();renderLayers();}});
      window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#settingsMenu').hidden){setSettingsOpen(false);return;}const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.closest('.cm-editor'))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if(e.key==='Escape'&&selected()){selectedId=null;refresh();return;}const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(moves[e.key]&&selected()){e.preventDefault();const n=e.shiftKey?10:1;selected().x+=moves[e.key][0]*n;selected().y+=moves[e.key][1]*n;pushHistory();refresh();}if((e.key==='Delete'||e.key==='Backspace')&&selected()){state.texts=state.texts.filter(t=>t.id!==selectedId);selectedId=null;pushHistory();refresh();}});
      window.addEventListener('resize',fitCanvas);
      window.addEventListener('pagehide',()=>{clearTimeout(persistTimer);persistSession();});

      window.__posterDebug = () => ({ canvas: [state.canvas.width, state.canvas.height], texts: structuredClone(state.texts), hasBackground: Boolean(backgroundData), historyLength: history.length });
      (async () => {
        restoreDirectories();
        let restored = false;
        try {
          let session = await dbGet('session', 'current');
          let migrated = false;
          if (!session) { const layout=await dbGet('session','layout'),bg=await dbGet('session','background');if(layout) { session={...layout,background:bg};migrated=true; } }
          const valid = session && Number(session.canvas?.width) > 0 && Number(session.canvas?.height) > 0 && Array.isArray(session.texts) && session.texts.every(t => t && typeof t === 'object' && t.content != null) && (session.background==null||(typeof session.background==='string'&&session.background.startsWith('data:image')));
          if (valid) {
            state = { canvas: { width: Number(session.canvas.width), height: Number(session.canvas.height) }, texts: session.texts };
            if (typeof session.background === 'string') { backgroundData = session.background; bgAssets.set(0, session.background); }
            sessionPersistenceEnabled = true;
            restored = true;
            if(migrated){await dbPut('session','current',currentSessionRecord());await dbDelete('session','layout');await dbDelete('session','background');}
          }
        } catch {}
        if (!restored) { state = blankState();backgroundData=null;await dbDelete('session','current'); }
        await loadBackground(backgroundData);
        history = []; future = []; pushHistory(false);
        applyLanguage(); refresh();
      })();
      if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    })();
  </script>
</body>
</html>
